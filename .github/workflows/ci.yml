name: CI

on:
  push:
    branches: ['feature/version2']
  pull_request:
    branches: ['feature/version2']

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
